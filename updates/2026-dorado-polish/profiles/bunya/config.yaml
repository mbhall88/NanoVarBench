# Snakemake workflow profile for Bunya (UQ) with the Slurm executor plugin.
#   snakemake -s workflow/Snakefile --workflow-profile profiles/bunya
executor: slurm
jobs: 50
software-deployment-method:
  - apptainer
  - conda
apptainer-args: "--bind /scratch"
conda-frontend: mamba
latency-wait: 60
rerun-incomplete: true
printshellcmds: true
show-failed-logs: true
local-cores: 2
# Resubmit a failed job up to twice. Bunya's sbatch sometimes fails with a transient
# "Socket timed out", which otherwise stops the whole run (#9).
retries: 2

default-resources:
  slurm_account: a_uqccr
  slurm_partition: general
  runtime: "1h"
  mem_mb: 4000

# Dorado runs on one full H100, never a MIG slice or an A100 (bun004/bun005/bun071 only offer
# slices, and their gres names aren't gpu:h100). The GPU partitions need a QoS; use the qos
# resource, since the plugin rejects --qos (and --constraint) in slurm_extra. bun072 has a
# broken GPU. Overriding call_dorado with --set-resources on the command line replaces this
# whole entry, not just one key. Dorado used ~1.9 GB RSS and 5-7 s of GPU time per 50x Read
# set (#7).
#
# Timings (#12) are only comparable on one piece of hardware, so call_dorado is pinned to the
# H100 SXM partition (gpu_sxm: bun118-120, "NVIDIA H100 80GB HBM3"). gpu_cuda's H100s are PCIe,
# a different part. The CPU steps that are timed (alignment, Clair3 and the Dorado CPU re-run)
# are pinned to the same CPU generation, the epyc5 nodes (AMD EPYC 9745). These pins are what
# make benchmark_hardware in config/config.yaml true; nothing in the jobs checks it.
set-resources:
  call_dorado: &dorado_gpu
    slurm_partition: gpu_sxm
    gres: "gpu:h100:1"
    qos: gpu
    slurm_extra: "'--exclude=bun072'"
    # Else the plugin adds --ntasks-per-gpu=1 and the job's srun aborts with
    # "SLURM_TRES_PER_TASK is mutually exclusive with --ntasks-per-gpu".
    tasks_per_gpu: 0
    mem_mb: 16000
    runtime: "30m"
  # The dorado aligner check's polish run (#13) is the same job, so it gets the same entry.
  call_dorado_aligner_bam: *dorado_gpu
  align: &timed_cpu
    constraint: epyc5
  call_clair3: *timed_cpu
  call_dorado_cpu: *timed_cpu
  # The smallvar pilot (#29) is timed on the same H100 SXM as call_dorado. It used 1.7-8.2 GB
  # RSS and 5-21 s per Read set.
  call_dorado_smallvar: *dorado_gpu

# The AF filter's small per-threshold jobs (#20) take seconds each, so each threshold's AF
# filter, Filter chain and both vcfdist runs go to Slurm as one job.
groups:
  af_filter: clair3_af_score
  filter_calls_af: clair3_af_score
  vcfdist_af: clair3_af_score
  # The smallvar pilot's Filter chain and both vcfdist runs (#29) take seconds each, so each
  # Read set's go to Slurm as one job.
  filter_calls_smallvar: smallvar_score
  vcfdist_smallvar: smallvar_score
