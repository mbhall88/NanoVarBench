# Workflow configuration. Paths default to directories inside this update (all
# gitignored). Put site-specific paths in config/local.yaml (gitignored; copy
# config/local.example.yaml) and pass it with --configfile config/local.yaml.

# --- Inputs -------------------------------------------------------------------------
samples: config/samples.tsv   # sample, species, dnd, truth_url, truth_md5
runs: config/runs.tsv         # sample, read_model, run, fastq_url, fastq_md5, fastq_bytes
# Downloads. Reads live at <reads_dir>/<read_model>/<run>_1.fastq.gz and Truth set
# tarballs at <truth_dir>/<sample>.tar.gz; either is downloaded only if missing.
reads_dir: data/reads
truth_dir: data/truth
download:
  method: kingfisher-ascp     # or curl (fastq_url from runs.tsv; slow from ENA FTP)
  kingfisher: kingfisher      # binary; needs a working Aspera setup
  attempts: 3

# --- Outputs ------------------------------------------------------------------------
work_dir: work                                        # reads, BAMs, raw calls, vcfdist output (large)
results_dir: results                                  # tables, filtered VCFs, benchmarks (small, gitignored)

# --- What to run --------------------------------------------------------------------
run:
  samples: [ATCC_25922__202309]
  read_models: [hac, sup]
  depths: [5, 10, 25, 50]
  arms: [A, B, C, D]

# Optional check (#13) that the reheadered-minimap2 path (ADR-0004) gives the same Dorado
# calls as `dorado aligner` + `dorado polish` without --any-bam. Empty = off. It isn't an Arm
# and adds no rows to results.tsv: its report is written to
# <results_dir>/dorado_aligner_check/. `snakemake ... dorado_aligner_check` runs just this.
dorado_aligner_check:
  samples: []       # e.g. [ATCC_25922__202309]
  read_models: []   # e.g. [hac, sup]
  depths: []        # e.g. [50]
  arm: D            # the Dorado Arm whose binary, version and Calling model are used
  material:         # the report flags the calls as materially different above either of these
    max_records: 5            # records that differ in the filtered VCFs
    max_best_f1_diff: 0.0005  # largest |Best F1 difference| over SNP, INDEL and ALL

# Optional extra analysis (#20): the AF filter. Clair3 runs on each listed Arm's alignment
# without --haploid_precise (diploid genotypes), and each het call is made ALT when its
# FORMAT/AF is >= the AF threshold and REF otherwise, before the Filter chain and vcfdist. It
# runs on every Read set in `run`, at every threshold. Empty arms = off. It isn't an Arm and
# adds no rows to results.tsv: its tables are <results_dir>/tables/clair3_af_filter{,_summary}.tsv.
# `snakemake ... clair3_af_filter` runs just this.
clair3_af_filter:
  arms: []          # e.g. [A, C]: Clair3 Arms whose alignment, Clair3 and Calling model are used
  thresholds: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8]
  reference_arm: D  # the tables compare with this Arm's calls as well as the Arm's own
  # A finished run's work_dir to read the Read sets' BAMs, Mutated references, Truth sets and
  # the Arms' own scores from, so they aren't re-made. Empty = this run's work_dir.
  input_work_dir:

# Optional pilot (#29): dorado smallvar, Dorado's diploid small-variant caller, on each listed
# Dorado Arm's RG-reheadered alignment, with the whole genome passed as --hemizygous-regions so
# it makes haploid calls. Dorado 2.1.2 has smallvar models only for hac v5.2.0 and v6.0.0 reads
# (none for v4.3.0 or sup), so `model` is forced in with --model-override: every result is a
# Basecall-model mismatch. smallvar writes only GT and GQ, so the AF filter can't be applied to
# its diploid calls. It runs on every Read set in `run`. Empty arms = off. It isn't an Arm and
# adds no rows to results.tsv or benchmarks.tsv: its tables are
# <results_dir>/tables/smallvar_pilot{,_runtime}.tsv. `snakemake ... smallvar_pilot` runs just this.
smallvar_pilot:
  arms: []          # e.g. [D]: Dorado Arms whose alignment and Dorado binary are used
  model: dna_r10.4.1_e8.2_400bps_hac@v6.0.0_smallvar@v1.0   # fetched into dorado.models_dir
  compare_arms: [C, D]  # the table puts these Arms' own scores beside smallvar's
  af_filter:        # and the AF filter's (#20) for this Clair3 Arm at this threshold
    arm: C
    threshold: 0.65
    work_dir:       # the AF filter run's work_dir to read its scores from. Empty = this run's.
  # A finished run's work_dir to read the Read sets' BAMs, Mutated references, Truth sets and
  # the compared Arms' scores from, so they aren't re-made. Empty = this run's work_dir.
  input_work_dir:

# --- Method -------------------------------------------------------------------------
read_models:  # Read model -> basecall model, written into the @RG DS for Dorado (ADR-0004)
  hac: dna_r10.4.1_e8.2_400bps_hac@v4.3.0
  sup: dna_r10.4.1_e8.2_400bps_sup@v4.3.0

qc:
  min_length: 1000
  min_qual: 10

subsample:  # ADR-0005: rasusa aln on a primary-only alignment of the QC'd reads
  seed: 20240102
  alignment: {aligner: minimap2, aligner_version: "2.31", preset: "lr:hq"}

actual_depth:  # actual depth is measured on Arm B's alignment of each Read set
  alignment: {aligner: minimap2, aligner_version: "2.31", preset: "lr:hq"}

# An Arm is an aligner + caller + Calling model combination (CONTEXT.md). Arms with the
# same aligner, version and preset share one BAM.
arms:
  A:  # the paper: minimap2 2.26 map-ont (its own BAM) + Clair3 1.0.5 with its bundled TF models
    aligner: minimap2
    aligner_version: "2.26"
    preset: "map-ont"
    caller: clair3
    caller_version: "1.0.5"
    calling_model: bundled_tf       # /opt/models/<Calling model> in the Clair3 1.0.5 image
  B:  # the lr:hq post: the shared lr:hq BAM + Clair3 1.0.5
    aligner: minimap2
    aligner_version: "2.31"
    preset: "lr:hq"
    caller: clair3
    caller_version: "1.0.5"
    calling_model: bundled_tf
  C:  # current Clair3: the shared lr:hq BAM + Clair3 2.0.3 with HKU's converted models
    aligner: minimap2
    aligner_version: "2.31"
    preset: "lr:hq"
    caller: clair3
    caller_version: "2.0.3"
    calling_model: hku_pytorch      # downloaded to clair3.models_dir and bind-mounted
  D:
    aligner: minimap2
    aligner_version: "2.31"
    preset: "lr:hq"
    caller: dorado
    caller_version: "2.1.2"
    calling_model: bacteria   # dorado polish --bacteria

dorado:
  bin:  # caller_version -> binary (the ONT CDN build, not a container)
    "2.1.2": resources/dorado-2.1.2-linux-x64/bin/dorado
  download_with: "2.1.2"      # version whose binary fetches missing models
  models_dir: resources/dorado_models
  models:     # Calling model -> the polishing model Dorado resolves for v4.3.0 reads
    bacteria: dna_r10.4.1_e8.2_400bps_polish_bacterial_methylation_v5.0.0
  device: "cuda:all"
  min_depth: 2                # matches Clair3's --min_coverage default (ADR-0002)
  cpu_run:    # timing-only re-run with --device cpu (#12); checked against the main calls
    depths: [50]
    threads: 8                # same budget as Clair3

clair3:  # Arms A, B and C. The Fine-tuned model is never used (ADR-0001).
  threads: 8
  # The paper's options for haploid bacterial calling (workflow/scripts/callers/clair3.sh at
  # the repo root). --min_coverage stays at its default of 2 in 1.0.5 and 2.0.3, which is the
  # Dorado --min-depth 2 (ADR-0002).
  options: [--platform=ont, --include_all_ctgs, --haploid_precise, --no_phasing_for_fa, --enable_long_indel]
  calling_models:   # Read model -> Calling model: the Calling model follows the Read model
    hac: r1041_e82_400bps_hac_v430
    sup: r1041_e82_400bps_sup_v430
  bundled_models_dir: /opt/models       # in the Clair3 1.0.5 image (TF models)
  models_dir: resources/clair3_models   # Arm C's HKU PyTorch models are downloaded here
  models_url: https://www.bio8.cs.hku.hk/clair3/clair3_models_rerio_pytorch
  # HKU publishes no checksums. These were recorded from a download on 2026-10-01 and are
  # checked on every download.
  model_sha256:
    r1041_e82_400bps_hac_v430:
      pileup.pt: 6e3b94040e7d7e722107f186076cbd348249ee384f9e9d4a3a175534023906bd
      full_alignment.pt: bac8823367f2c571c954252f7c6fea111b3f80560d9db41c1ae8065cab2cc7a9
    r1041_e82_400bps_sup_v430:
      pileup.pt: 806d7439555c157f3b75f2d7fb317c15985a2be6562184bb734c72aaf68d0287
      full_alignment.pt: 235bbde32c675bf09032a2bd410f63e521ee36e0a2ab70b9bdc1988dfe768f87

# The hardware the timed jobs run on, written into benchmarks.tsv (by device) and results.tsv.
# It isn't measured in the jobs: the Slurm profile pins the partition and constraint that
# provide it (profiles/bunya), and the README records how it was confirmed once.
benchmark_hardware:
  gpu: "NVIDIA H100 80GB HBM3"
  cpu: "AMD EPYC 9745"

# The figures and tables for the post (#14), made from the aggregated tables alone.
figures:
  arm_labels:           # the Arm names in CONTEXT.md, written "Arm <letter> (<label>)"
    A: paper
    B: lr:hq post
    C: current Clair3
    D: Dorado
  default_pass_arms: [C, D]   # Figure 1's dashed Default-PASS lines
  pr_depths: [10, 50]         # Figure 2's PR curves; a Depth missing from the run is skipped
  # The extra series (#28) for Figures 1-3 and Table S1 from the AF filter analysis (#20),
  # labelled "Arm <arm> + AF filter (<threshold>)"; it isn't one of the Arms. It is
  # drawn when clair3_af_filter.arms includes this Arm; otherwise the figures and tables are
  # as without it. The threshold must be one of clair3_af_filter.thresholds.
  af_filter:
    arm: C
    threshold: 0.65
  dpi: 300

max_indel: 50  # Filter chain: drop indels longer than this

vcfdist:  # ADR-0003
  largest_variant: 50
  credit_threshold: 1.0
